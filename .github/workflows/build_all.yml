name: Build All

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          cache: gradle
          java-version: |
            16
            17
            21

      - name: Build All Modules
        run: |
          chmod +x ./gradlew
          ./gradlew build

      - name: Process Artifacts
        run: |
          mkdir -p output
          
          TAG_NAME="${GITHUB_REF_NAME}"
          echo "Tag: $TAG_NAME"
          
          VERSION="${TAG_NAME#v}"
          
          if [[ "$VERSION" == *"-"* ]]; then
            SUFFIX="-${VERSION#*-}"
          else
            SUFFIX=""
          fi
          
          echo "Suffix: $SUFFIX"
          
          find forge neoforge -type f -path "*/build/libs/*-all.jar" | while read FILE; do
            BASENAME=$(basename "$FILE")
            NEW_NAME="${BASENAME/-all/$SUFFIX}"
            echo "Renaming $BASENAME -> $NEW_NAME"
            cp "$FILE" "output/$NEW_NAME"
          done
          
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: output/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}