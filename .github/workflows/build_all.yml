name: Build All

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          cache: gradle
          java-version: |
            16
            17
            21

      - name: Build All Modules
        run: |
          chmod +x ./gradlew
          ./gradlew build

      - name: Process Artifacts
        run: |
          mkdir -p output
          
          TAG_NAME="${GITHUB_REF_NAME}"
          echo "Tag: $TAG_NAME"
          
          VERSION="${TAG_NAME#v}"
          
          if [[ "$VERSION" == *"-"* ]]; then
            SUFFIX="-${VERSION#*-}"
          else
            SUFFIX=""
          fi
          
          echo "Suffix: $SUFFIX"
          
          find forge neoforge -type f -path "*/build/libs/*-all.jar" | while read FILE; do
            BASENAME=$(basename "$FILE")
            NEW_NAME="${BASENAME/-all/$SUFFIX}"
            echo "Renaming $BASENAME -> $NEW_NAME"
            cp "$FILE" "output/$NEW_NAME"
          done
          
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: output/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Modrinth
        if: ${{ github.event_name == 'release' && github.event.release.prerelease == false }}
        run: |
          PROJECT_ID="A0VZd1kW"
          VERSION_TYPE="release"

          CHANGELOG=$(jq -Rs . <<< "${{ github.event.release.body }}")

          for FILE in output/*.jar; do
            BASENAME=$(basename "$FILE")
            NAME="${BASENAME%.jar}"

            echo "Processing $BASENAME"

            if [[ "$BASENAME" == *"-forge-"* ]]; then
              LOADER="forge"
            elif [[ "$BASENAME" == *"-neoforge-"* ]]; then
              LOADER="neoforge"
            else
              echo "Unknown loader, skipping"
              continue
            fi

            VERSION_NUMBER=$(echo "$NAME" | sed -E 's/^Concerto-(forge|neoforge)-//')

            MC_VERSION=$(echo "$VERSION_NUMBER" | sed -E 's/.*-mc([0-9\.]+).*/\1/')

            echo "Loader: $LOADER"
            echo "Version: $VERSION_NUMBER"
            echo "MC Version: $MC_VERSION"

            GAME_VERSIONS=$(jq -c --arg v "$MC_VERSION" '.[$v] // [$v]' .github/modrinth_game_versions.json)

            echo "Game Versions: $GAME_VERSIONS"

            curl --location 'https://api.modrinth.com/v2/version' \
              --header "Authorization: $MODRINTH_TOKEN" \
              --form "data={
                \"name\": \"$NAME\",
                \"version_number\": \"$VERSION_NUMBER\",
                \"changelog\": $CHANGELOG,
                \"dependencies\": [],
                \"game_versions\": $GAME_VERSIONS,
                \"version_type\": \"$VERSION_TYPE\",
                \"loaders\": [\"$LOADER\"],
                \"featured\": false,
                \"status\": \"listed\",
                \"requested_status\": null,
                \"project_id\": \"$PROJECT_ID\",
                \"file_parts\": [\"$BASENAME\"],
                \"primary_file\": \"$BASENAME\"
              }" \
              --form "file=@$FILE"

          done
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}